spring.application.name=userProfile-service

# Server
server.port=8092
server.shutdown=graceful

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/makemytrip_userdb
spring.datasource.username=postgres
spring.datasource.password=yash8252

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

# Metrics
management.metrics.tags.application=${spring.application.name}

# Logging
logging.level.root=INFO
logging.level.com.company.MakeMyTrip.userProfile_service=INFO