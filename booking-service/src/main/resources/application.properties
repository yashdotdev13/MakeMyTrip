spring.application.name=booking-service

server.port=8093
server.shutdown=graceful


spring.datasource.url=jdbc:postgresql://localhost:5432/makemytrip_bookingdb
spring.datasource.username=postgres
spring.datasource.password=yash8252

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true



eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost



# Kafka Consumer
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=booking-service

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.company.MakeMyTrip.events
spring.kafka.consumer.properties.spring.json.use.type.headers=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

management.metrics.tags.application=${spring.application.name}

logging.level.root=INFO
logging.level.com.company.MakeMyTrip.booking_service=INFO

booking.reservation.hold-duration-minutes=10