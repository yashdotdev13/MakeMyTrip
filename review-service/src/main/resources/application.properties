spring.application.name=review-service




server.port=8096

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/makemytrip_reviewdb
spring.datasource.username=postgres
spring.datasource.password=yash8252
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost


spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=review-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.company.MakeMyTrip.events
spring.kafka.consumer.properties.spring.json.use.type.headers=false