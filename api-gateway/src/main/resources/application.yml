jwt:
  secretKey: mysupersecurekeyformysafarsaathijwt1234567890abcdefABCDEF1234567890



server:
  port: 8081

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - name: AuthenticationFilter


        - id: userProfile-service
          uri: lb://userProfile-service
          predicates:
            - Path=/profiles/**
          filters:
            - name: AuthenticationFilter


        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/booking/**
          filters:
            - name: AuthenticationFilter

        - id: pricing-service
          uri: lb://pricing-service
          predicates:
            - Path=/pricing/**
          filters:
            - name: AuthenticationFilter




eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
