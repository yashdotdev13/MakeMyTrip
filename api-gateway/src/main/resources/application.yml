jwt:
  secretKey: mysupersecurekeyformysafarsaathijwt1234567890abcdefABCDEF1234567890


gateway:
  security:
    public-paths:
      - /auth/login
      - /auth/register

server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: api-gateway

  lifecycle:
    timeout-per-shutdown-phase: 20s

  cloud:
    gateway:

      httpClient:
        connect-timeout: 3000
        response-timeout: 10s

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "${CORS_ALLOWED_ORIGIN:http://localhost:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-Correlation-Id
              - X-User-Id
            exposedHeaders:
              - X-Correlation-Id
            allowCredentials: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=Referrer-Policy, no-referrer

      routes:

        - id: auth-service
          uri: lb://Auth-service
          predicates:
            - Path=/auth/**
          filters:
            - name: AuthenticationFilter

        - id: user-profile-service
          uri: lb://user-profile-service
          predicates:
            - Path=/profiles/**
          filters:
            - name: AuthenticationFilter

        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/booking/**
          filters:
            - name: AuthenticationFilter

        - id: pricing-service
          uri: lb://pricing-service
          predicates:
            - Path=/pricing/**
          filters:
            - name: AuthenticationFilter

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payment/**
          filters:
            - name: AuthenticationFilter

        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/review/**
          filters:
            - name: AuthenticationFilter

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notification/**
          filters:
            - name: AuthenticationFilter

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: when_authorized

  metrics:
    tags:
      application: ${spring.application.name}


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.company.MakeMyTrip.api_gateway: INFO
    org.springframework.cloud.gateway: INFO
